<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;background:#FBFAF7;font-family:Heebo,Arial,sans-serif;color:#191A2E;position:relative;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(2px)}
  .b1{width:520px;height:520px;background:#FCE1EF;left:-160px;top:-180px}
  .b2{width:360px;height:360px;background:#BEE0F2;right:-120px;bottom:-160px;opacity:.7}
  .wrap{position:absolute;inset:0;padding:64px 72px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:22px;font-weight:700;letter-spacing:.14em;color:#EF55A5}
  h1{font-size:64px;line-height:1.15;font-weight:900;margin:18px 0 0;letter-spacing:-.02em;max-width:900px}
  .sub{font-size:25px;font-weight:500;color:#6B6B7B;margin-top:18px;max-width:900px;line-height:1.45}
  .foot{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:800}
  .brand img{height:56px}
  .pill{background:#EF55A5;color:#191A2E;font-weight:800;font-size:24px;padding:16px 34px;border-radius:100px}
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="wrap">
    <div>
      <div class="eyebrow">הליווי המלא של אמא משקיעה</div>
      <h1>תוך 28 יום הכסף של המשפחה שלך מחולק, מושקע, ועובד.</h1>
      <div class="sub">בלי לוותר על החוויות והפאן של היום, בלי לקרוא דו״חות פיננסיים ואקסלים מסובכים, ובלי להתעסק ולהסתבך עם זה כל חודש מחדש.</div>
    </div>
    <div class="foot">
      <div class="brand"><img src="assets/logo.png" alt=""><span>עדי סומך</span></div>
      <div class="pill">יוצאות לדרך 5.10 · 30 מקומות</div>
    </div>
  </div>
</body>
</html>
